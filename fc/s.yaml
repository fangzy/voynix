# Serverless Devs 配置 — Voynix Xray 双地域部署 (FC 3.0 自定义容器)
#
# 部署用法(需先 export 下方环境变量):
#   cd fc && s deploy -y            # 部署新加坡 + 香港
#   cd fc && s voynix-hk deploy -y  # 仅部署香港
#
# 依赖环境变量:
#   UUID                  VLESS 客户端 UUID(必填,须与客户端配置一致)
#   GRPC_SERVICE_NAME     默认 ProxyService
#   DOCKERHUB_USERNAME    Docker Hub 用户名(双节点镜像仓库 owner)
#
# 密钥(access: default)由 CI 的 setup-s 或本地 `s config add` 配置
edition: 3.0.0
name: voynix
access: "default"

vars:
  region_sg: ap-southeast-1   # 新加坡 FC
  region_hk: cn-hongkong      # 香港 FC

resources:
  voynix-sg:
    component: fc3
    props:
      region: ${vars.region_sg}
      functionName: voynix-xray-sg
      description: 'Voynix Xray proxy (Singapore) - Docker Hub public image'
      runtime: custom-container
      timeout: 3600
      memorySize: 128
      cpu: 0.1
      diskSize: 512
      instanceConcurrency: 20
      internetAccess: true
      scalingConfig:
        minInstances: 0
      concurrencyConfig:
        reservedConcurrency: 15
      customContainerConfig:
        image: 'docker.io/${env(DOCKERHUB_USERNAME)}/voynix-xray:latest'
        port: 8089
      environmentVariables:
        UUID: ${env(UUID)}
        GRPC_SERVICE_NAME: ${env(GRPC_SERVICE_NAME)}
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods: [GET, POST]

  voynix-hk:
    component: fc3
    props:
      region: ${vars.region_hk}
      functionName: voynix-xray-hk
      description: 'Voynix Xray proxy (Hong Kong) - Docker Hub public image'
      runtime: custom-container
      timeout: 3600
      memorySize: 128
      cpu: 0.1
      diskSize: 512
      instanceConcurrency: 20
      internetAccess: true
      logConfig: auto
      scalingConfig:
        minInstances: 0
      concurrencyConfig:
        reservedConcurrency: 15
      customContainerConfig:
        image: 'docker.io/${env(DOCKERHUB_USERNAME)}/voynix-xray:latest'
        port: 8089
      environmentVariables:
        UUID: ${env(UUID)}
        GRPC_SERVICE_NAME: ${env(GRPC_SERVICE_NAME)}
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods: [GET, POST]
