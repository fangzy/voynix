# Serverless Devs 配置 — Voynix Xray 多地域部署 (FC 3.0 自定义容器)
#
# 部署用法(需先 export 下方环境变量):
#   cd fc && s deploy -y            # 部署全部已定义节点(注意:会部署到所有地域)
#   cd fc && s voynix-hk deploy -y  # 仅部署香港
#   cd fc && s voynix-tokyo deploy -y  # 仅部署东京
#
# 部署哪些节点由 GitHub Actions 的 FC_NODES 变量控制(逗号分隔,如 sg,hk,tokyo):
#   GitHub → Settings → Variables → FC_NODES = sg,hk,tokyo
#   未设置 FC_NODES(或为空)时 CI 显式报错;未知节点键同样报错
#
# 依赖环境变量:
#   UUID                  VLESS 客户端 UUID(必填,须与客户端配置一致)
#   DOCKERHUB_USERNAME    Docker Hub 用户名(各节点镜像仓库 owner)
#   FC_BEARER_TOKEN       HTTP 触发器 Bearer 鉴权 token(必填,32-128 字符 Base64 字符集;
#                         存 .env common 节,gitignored;客户端 ws-opts.headers 带 Authorization: Bearer)
#   RELAY_ENTRIES         中转入口配置(格式 入口短码>出口短码,分号分隔多条,如 sh>hk;sz>sg;出口 fcapp.run 域名由 deploy-fc.sh 自动查询,无需手填)
#   RELAY_EXIT_PORT       中转出口端口(默认 443;本地联调 8089)
#   RELAY_EXIT_TLS        中转出口是否 TLS(默认 true;本地容器联调 false)
#
# 密钥(access: default)由 CI 的 setup-s 或本地 `s config add` 配置
#
# 注意:仅列出支持自定义容器镜像的 FC 3.0 地域(2026-08 依据阿里云官方
# supported-regions 图标实测核对)。不支持自定义容器的地域已排除:
#   ap-northeast-2(首尔)/ap-southeast-3(吉隆坡)/ap-southeast-5(雅加达)/
#   ap-southeast-7(曼谷)/eu-west-1(伦敦)/me-central-1(利雅得)/
#   cn-qingdao(青岛)/cn-wulanchabu(乌兰察布)/cn-chengdu(成都)
edition: 3.0.0
name: voynix
access: "default"

vars:
  region_sg: ap-southeast-1    # 新加坡
  region_hk: cn-hongkong       # 香港
  region_tokyo: ap-northeast-1 # 东京
  region_frankfurt: eu-central-1 # 法兰克福
  region_va: us-east-1         # 弗吉尼亚
  region_sv: us-west-1         # 硅谷
  # 国内地域(代理服务部署国内节点有合规风险,请自行评估;FC 部分地域需单独开通)
  region_hangzhou: cn-hangzhou
  region_shanghai: cn-shanghai
  region_beijing: cn-beijing
  region_zhangjiakou: cn-zhangjiakou
  region_huhehaote: cn-huhehaote
  region_shenzhen: cn-shenzhen

# 公共 props(YAML 锚点,各节点通过 props: <<: 深层合并,仅覆盖地域/函数名/描述)
x-node: &node-base
  runtime: custom-container
  timeout: 3600
  memorySize: 128
  cpu: 0.1
  diskSize: 512
  instanceConcurrency: 30
  internetAccess: true
  logConfig: auto
  scalingConfig:
    minInstances: 0
  concurrencyConfig:
    reservedConcurrency: 15
  customContainerConfig:
    image: 'docker.io/${env(DOCKERHUB_USERNAME)}/${env(IMAGE_NAME)}:latest'
    port: 8089
  environmentVariables:
    UUID: ${env(UUID)}
    WS_PATH: ${env(WS_PATH)}
  triggers:
    - triggerName: httpTrigger
      triggerType: http
      qualifier: LATEST
      triggerConfig:
        authType: bearer
        disableURLInternet: false
        methods: [GET, POST]
        authConfig:
          BearerFormat: opaque
          opaqueTokenConfig:
            tokens:
              - enable: true
                tokenData: ${env(FC_BEARER_TOKEN)}
                tokenName: voynix

resources:
  voynix-sg:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_sg}
      functionName: ${env(IMAGE_NAME)}-sg
      description: 'Voynix Xray proxy (Singapore) - Docker Hub public image'

  voynix-hk:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_hk}
      functionName: ${env(IMAGE_NAME)}-hk
      description: 'Voynix Xray proxy (Hong Kong) - Docker Hub public image'

  voynix-tokyo:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_tokyo}
      functionName: ${env(IMAGE_NAME)}-tokyo
      description: 'Voynix Xray proxy (Tokyo) - Docker Hub public image'

  voynix-frankfurt:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_frankfurt}
      functionName: ${env(IMAGE_NAME)}-frankfurt
      description: 'Voynix Xray proxy (Frankfurt) - Docker Hub public image'

  voynix-va:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_va}
      functionName: ${env(IMAGE_NAME)}-va
      description: 'Voynix Xray proxy (US Virginia) - Docker Hub public image'

  voynix-sv:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_sv}
      functionName: ${env(IMAGE_NAME)}-sv
      description: 'Voynix Xray proxy (US Silicon Valley) - Docker Hub public image'

  # ---- 国内地域(代理服务部署国内节点有合规风险,请自行评估) ----
  voynix-hangzhou:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_hangzhou}
      functionName: ${env(IMAGE_NAME)}-hangzhou
      description: 'Voynix Xray proxy (Hangzhou) - Docker Hub public image'

  voynix-shanghai:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_shanghai}
      functionName: ${env(IMAGE_NAME)}-shanghai
      description: 'Voynix Xray relay entry (Shanghai → Tokyo exit) - Docker Hub public image'
      # 中转入口节点:整块覆盖 environmentVariables(锚点合并为浅合并),outbound 链到出口节点
      # RELAY_EXIT_HOST=出口节点 fcapp.run 域名(如 tokyo);未设置时 entrypoint 回退直连模式
      # 注意:FC 保留 FC_ 前缀环境变量名,容器内 token 变量须叫 RELAY_BEARER_TOKEN(值来自 FC_BEARER_TOKEN)
      environmentVariables:
        UUID: ${env(UUID)}
        WS_PATH: ${env(WS_PATH)}
        RELAY_BEARER_TOKEN: ${env(FC_BEARER_TOKEN)}
        RELAY_EXIT_HOST: ${env(RELAY_EXIT_HOST)}
        RELAY_EXIT_PORT: ${env(RELAY_EXIT_PORT)}
        RELAY_EXIT_TLS: ${env(RELAY_EXIT_TLS)}
      # CN 地域 FC 无法直连 Docker Hub("registry is not reachable"),走公共加速镜像 + digest 固定
      # (digest 与 Docker Hub 官方一致,防篡改;FC 仅在函数创建/更新时拉取,之后用内部缓存,不依赖镜像站日常可用)
      # RELAY_IMAGE 在 .env deploy 节维护;开通 ACR 个人版后可换 registry.cn-shanghai.aliyuncs.com
      customContainerConfig:
        image: '${env(RELAY_IMAGE)}'
        port: 8089

  voynix-beijing:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_beijing}
      functionName: ${env(IMAGE_NAME)}-beijing
      description: 'Voynix Xray proxy (Beijing) - Docker Hub public image'

  voynix-zhangjiakou:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_zhangjiakou}
      functionName: ${env(IMAGE_NAME)}-zhangjiakou
      description: 'Voynix Xray proxy (Zhangjiakou) - Docker Hub public image'

  voynix-huhehaote:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_huhehaote}
      functionName: ${env(IMAGE_NAME)}-huhehaote
      description: 'Voynix Xray proxy (Hohhot) - Docker Hub public image'

  voynix-shenzhen:
    component: fc3
    props:
      <<: *node-base
      region: ${vars.region_shenzhen}
      functionName: ${env(IMAGE_NAME)}-shenzhen
      description: 'Voynix Xray relay entry (Shenzhen → exit node) - Docker Hub public image'
      # 中转入口节点:整块覆盖 environmentVariables(锚点合并为浅合并),outbound 链到出口节点
      # RELAY_EXIT_HOST=出口节点 fcapp.run 域名(如 tokyo);未设置时 entrypoint 回退直连模式
      # 注意:FC 保留 FC_ 前缀环境变量名,容器内 token 变量须叫 RELAY_BEARER_TOKEN(值来自 FC_BEARER_TOKEN)
      environmentVariables:
        UUID: ${env(UUID)}
        WS_PATH: ${env(WS_PATH)}
        RELAY_BEARER_TOKEN: ${env(FC_BEARER_TOKEN)}
        RELAY_EXIT_HOST: ${env(RELAY_EXIT_HOST)}
        RELAY_EXIT_PORT: ${env(RELAY_EXIT_PORT)}
        RELAY_EXIT_TLS: ${env(RELAY_EXIT_TLS)}
      # CN 地域 FC 无法直连 Docker Hub("registry is not reachable"),走公共加速镜像 + digest 固定
      # (digest 与 Docker Hub 官方一致,防篡改;FC 仅在函数创建/更新时拉取,之后用内部缓存,不依赖镜像站日常可用)
      # RELAY_IMAGE 在 .env deploy 节维护;开通 ACR 个人版后可换 registry.cn-shanghai.aliyuncs.com
      customContainerConfig:
        image: '${env(RELAY_IMAGE)}'
        port: 8089
