# Serverless Devs 配置 — Voynix Xray WebSocket 实验节点(仅新加坡,独立配置文件)
#
# 目的:与生产 gRPC 配置(fc/s.yaml)隔离的 WS 传输实验,不影响生产节点。
#   - 独立函数名  ${IMAGE_NAME}-ws-sg(默认 voynix-xray-ws-sg),与生产 voynix-xray-sg 并存
#   - 独立镜像 tag :ws(docker.io/<user>/voynix-xray:ws),不动 :latest
#   - 容器内通过 TRANSPORT=ws 选择 WS 配置模板(entrypoint.sh 支持)
#
# 部署用法(需先 export 依赖环境变量,参见 scripts/deploy-fc.sh 的加载逻辑):
#   cd fc && s deploy -t s.ws.yaml -y
#
# 依赖环境变量:
#   UUID                  VLESS 客户端 UUID(必填,与生产同 UUID,便于客户端 A/B)
#   GRPC_SERVICE_NAME     默认 ProxyService
#   WS_PATH               默认 ws(WS path = /ws,客户端 ws-opts.path 需一致)
#   DOCKERHUB_USERNAME    Docker Hub 用户名
#   IMAGE_NAME            默认 voynix-xray(镜像名 + 函数名前缀)
#   FC_BEARER_TOKEN       Bearer 认证 token(32-128 字符,Base64 字符集;客户端 ws-opts.headers
#                         带 Authorization: Bearer <token>;存于 docker-image/.env,gitingored)
#
# 密钥(access: default)由 `s config add -a default` 配置(scripts/deploy-fc.sh 会自动配置)
edition: 3.0.0
name: voynix-ws
access: "default"

vars:
  region_sg: ap-southeast-1    # 新加坡

resources:
  voynix-sg:
    component: fc3
    props:
      runtime: custom-container
      region: ${vars.region_sg}
      functionName: ${env(IMAGE_NAME)}-ws-sg
      description: 'Voynix Xray proxy WebSocket experiment (Singapore)'
      timeout: 3600
      memorySize: 128
      cpu: 0.1
      diskSize: 512
      instanceConcurrency: 30
      internetAccess: true
      logConfig: auto
      scalingConfig:
        minInstances: 0
      concurrencyConfig:
        reservedConcurrency: 15
      customContainerConfig:
        image: 'docker.io/${env(DOCKERHUB_USERNAME)}/${env(IMAGE_NAME)}:ws'
        port: 8089
      environmentVariables:
        UUID: ${env(UUID)}
        GRPC_SERVICE_NAME: ${env(GRPC_SERVICE_NAME)}
        TRANSPORT: ws
        WS_PATH: ${env(WS_PATH)}
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: bearer
            disableURLInternet: false
            methods: [GET, POST]
            authConfig:
              BearerFormat: opaque
              opaqueTokenConfig:
                tokens:
                  - enable: true
                    tokenData: ${env(FC_BEARER_TOKEN)}
                    tokenName: voynix
