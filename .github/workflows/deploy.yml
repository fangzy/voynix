name: Build & Deploy Voynix Xray

on:
  push:
    branches: [main, master]
    paths:
      - 'docker-image/**'
      - '.github/workflows/deploy.yml'
      - 'fc/**'
  workflow_dispatch:

env:
  IMAGE_NAME: voynix-xray

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (for FC nodes)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./docker-image
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            XRAY_VERSION=v26.2.6

  deploy-fc:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Serverless Devs
        uses: Serverless-Devs/setup-s@v1
        with:
          provider: aliyun
          version: 3.1.10
          account_id: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
          access_key_id: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          access_key_secret: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          access: default

      - name: Deploy to FC (Singapore + Hong Kong)
        env:
          UUID: ${{ secrets.UUID }}
          GRPC_SERVICE_NAME: ${{ secrets.GRPC_SERVICE_NAME || 'ProxyService' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cd fc
          s deploy -y
