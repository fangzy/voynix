name: Build & Deploy Voynix Xray

on:
  push:
    branches: [main, master]
    paths:
      - 'docker-image/**'
      - '.github/workflows/deploy.yml'
      - 'fc/**'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.IMAGE_NAME || 'voynix-xray' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Check required secrets (build-and-push)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$DOCKERHUB_USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$DOCKERHUB_TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "❌ Missing secrets:$missing"
            exit 1
          fi
          echo "✅ build-and-push secrets OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub (for FC nodes)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker-image
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            XRAY_VERSION=v26.2.6

  deploy-fc:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Validate FC_NODES
        env:
          FC_NODES: ${{ vars.FC_NODES }}
          RELAY_ENTRIES: ${{ vars.RELAY_ENTRIES }}
        run: |
          # 空/空白检测
          if [ -z "${FC_NODES//[[:space:]]/}" ]; then
            echo "❌ FC_NODES 未设置或为空,未指定任何部署节点"
            echo "请配置: GitHub → Settings → Secrets and variables → Actions → Variables → FC_NODES"
            echo "示例: FC_NODES = sg,hk,tokyo"
            exit 1
          fi
          # 逐个校验节点键(逗号分隔)
          for n in $(echo "$FC_NODES" | tr ',' ' '); do
            case "$n" in
              sg|hk|tokyo|frankfurt|va|sv|hangzhou|shanghai|beijing|zhangjiakou|huhehaote|shenzhen) ;;
              *) echo "❌ 未知节点: '$n'(FC_NODES 含无效节点键)"; exit 1 ;;
            esac
          done
          # RELAY_ENTRIES(入口>出口完整fcapp.run域名,分号分隔):部署范围内的中转入口必须带出口域名
          # (镜像 digest 由部署步骤自动查询 Docker Hub,无需配置 Variables)
          if [ -n "$RELAY_ENTRIES" ]; then
            for entry in $(echo "$RELAY_ENTRIES" | tr ';' ' '); do
              ek=$(echo "$entry" | cut -d'>' -f1)
              ex=$(echo "$entry" | cut -s -d'>' -f2)
              if [ -z "$ek" ] || [ -z "$ex" ]; then
                echo "❌ RELAY_ENTRIES 格式错误: '$entry'(应为 入口>出口完整fcapp.run域名,如 shanghai>voynix-xray-hk-xxx.cn-hongkong.fcapp.run)"
                exit 1
              fi
              case " $(echo "$FC_NODES" | tr ',' ' ') " in
                *" $ek "*)
                  echo "✅ FC_NODES 含中转入口 $ek(出口已在 RELAY_ENTRIES 声明)"
                  ;;
              esac
            done
          fi
          echo "✅ FC_NODES 校验通过: $FC_NODES"

      - name: Check required secrets (deploy-fc)
        env:
          ALIBABA_CLOUD_ACCOUNT_ID: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          UUID: ${{ secrets.UUID }}
          FC_BEARER_TOKEN: ${{ secrets.FC_BEARER_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          missing=""
          [ -n "$ALIBABA_CLOUD_ACCOUNT_ID" ] || missing="$missing ALIBABA_CLOUD_ACCOUNT_ID"
          [ -n "$ALIBABA_CLOUD_ACCESS_KEY_ID" ] || missing="$missing ALIBABA_CLOUD_ACCESS_KEY_ID"
          [ -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" ] || missing="$missing ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          [ -n "$UUID" ] || missing="$missing UUID"
          [ -n "$FC_BEARER_TOKEN" ] || missing="$missing FC_BEARER_TOKEN"
          [ -n "$DOCKERHUB_USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          if [ -n "$missing" ]; then
            echo "❌ Missing secrets:$missing"
            exit 1
          fi
          echo "✅ deploy-fc secrets OK"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s@3.1.10

      - name: Install aliyun CLI
        run: |
          curl -sL -o /tmp/aliyun-cli.tgz "https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz"
          tar xzf /tmp/aliyun-cli.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/aliyun
          aliyun --version

      - name: Setup Python (PyYAML for s.yaml parsing)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Configure Aliyun credentials (access=default)
        env:
          ALIBABA_CLOUD_ACCOUNT_ID: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          s config add -a default \
            --AccountID "$ALIBABA_CLOUD_ACCOUNT_ID" \
            --AccessKeyID "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --AccessKeySecret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            -f

      - name: Deploy FC nodes
        env:
          FC_NODES: ${{ vars.FC_NODES }}
          UUID: ${{ secrets.UUID }}
          FC_BEARER_TOKEN: ${{ secrets.FC_BEARER_TOKEN }}
          WS_PATH: ${{ secrets.WS_PATH || 'ws' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ secrets.IMAGE_NAME || 'voynix-xray' }}
          # aliyun CLI 凭据(GetTrigger 查询中转出口节点 fcapp.run 域名)
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          # 中转入口配置(入口短码>出口短码,如 sh>hk;部署时自动查出口域名,镜像 digest 自动查询)
          RELAY_ENTRIES: ${{ vars.RELAY_ENTRIES }}
          RELAY_EXIT_PORT: ${{ vars.RELAY_EXIT_PORT || '443' }}
          RELAY_EXIT_TLS: ${{ vars.RELAY_EXIT_TLS || 'true' }}
        run: |
          # 解析 RELAY_ENTRIES(入口短码>出口短码)→ 出口 fcapp.run 域名经 aliyun fc GetTrigger 自动查询
          # CN 加速镜像 digest 自动查询 Docker Hub(均无需配置)
          resolve_node_key() {
            case "$1" in
              bj) echo "beijing" ;;
              hz) echo "hangzhou" ;;
              sh) echo "shanghai" ;;
              sz) echo "shenzhen" ;;
              *)  echo "$1" ;;
            esac
          }
          # s 对 s.yaml 全文件做 ${env()} 解析且空值报错("not found"):直连节点也须非空占位(中转入口出口/镜像 digest 随后覆写)
          export RELAY_EXIT_HOST="${RELAY_EXIT_HOST:-direct.invalid}"
          RELAY_IMAGE_MIRROR="${RELAY_IMAGE_MIRROR:-docker.1panel.live}"
          export RELAY_IMAGE="${RELAY_IMAGE_MIRROR}/${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
          # GitHub Variable 若从 .env 复制会带上引号(如 "sh>hk;sz>sg"),先剥掉再解析
          RELAY_ENTRIES="$(echo "$RELAY_ENTRIES" | tr -d '"')"
          relay_map=""
          if [ -n "$RELAY_ENTRIES" ]; then
            for entry in $(echo "$RELAY_ENTRIES" | tr ';' ' '); do
              ek=$(resolve_node_key "$(echo "$entry" | cut -d'>' -f1)")
              ex=$(resolve_node_key "$(echo "$entry" | cut -s -d'>' -f2)")
              [ -n "$ek" ] && [ -n "$ex" ] || { echo "❌ RELAY_ENTRIES 格式错误: '$entry'(应为 入口短码>出口短码,如 sh>hk)"; exit 1; }
              meta=$(python3 -c "
          import yaml, sys
          d = yaml.safe_load(open('fc/s.yaml'))
          res = d['resources'].get('voynix-$ex')
          if not res:
              print(f'ERROR: 出口节点 $ex 不在 fc/s.yaml(检查 RELAY_ENTRIES 出口拼写/别名)', file=sys.stderr)
              sys.exit(1)
          p = res['props']
          region_var = p['region'].replace('\${vars.','').replace('}','')
          print(f\"{d['vars'][region_var]}|{p['functionName']}\")
          ")
              region="${meta%%|*}"
              fn="$(echo "${meta#*|}" | sed "s|\${env(IMAGE_NAME)}|${IMAGE_NAME}|g")"
              url=$(aliyun fc GetTrigger --region "$region" --functionName "$fn" --triggerName httpTrigger 2>/dev/null | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              print(d.get('httpTrigger', {}).get('urlInternet', ''))
          except Exception:
              pass
          ")
              [ -n "$url" ] || { echo "❌ 出口节点 $ex($fn @ $region)未部署或无 URL,请先部署出口节点"; exit 1; }
              relay_map="$relay_map $ek|$(echo "$url" | sed 's|https://||; s|/$||')"
            done
          fi
          need_image=""
          for n in $(echo "$FC_NODES" | tr ',' ' '); do
            echo "$relay_map" | grep -q "^$n|" && need_image=1
          done
          if [ -n "$need_image" ]; then
            digest=$(curl -s --max-time 30 "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/tags/latest" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('digest',''))" 2>/dev/null || true)
            if [ -z "$digest" ]; then
              echo "❌ 查询 Docker Hub digest 失败(${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest)"
              exit 1
            fi
            export RELAY_IMAGE="${RELAY_IMAGE_MIRROR}/${DOCKERHUB_USERNAME}/${IMAGE_NAME}@${digest}"
            echo "🔍 CN 加速镜像(自动查询 digest): ${RELAY_IMAGE}"
          fi
          cd fc
          for n in $(echo "$FC_NODES" | tr ',' ' '); do
            relay_exit=$(echo "$relay_map" | tr ' ' '\n' | grep "^$n|" | head -1 | cut -d'|' -f2)
            if [ -n "$relay_exit" ]; then
              export RELAY_EXIT_HOST="$relay_exit"
              echo "🚀 $n: 中转入口,出口=$relay_exit"
            fi
            echo "🚀 部署节点: $n"
            s voynix-${n} deploy -y
          done
