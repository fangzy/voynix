name: Build & Deploy Voynix Xray

on:
  push:
    branches: [main, master]
    paths:
      - 'docker-image/**'
      - '.github/workflows/deploy.yml'
      - 'fc/**'
  workflow_dispatch:

env:
  IMAGE_NAME: voynix-xray

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Check required secrets (build-and-push)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=""
          [ -n "$DOCKERHUB_USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "$DOCKERHUB_TOKEN" ] || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "❌ Missing secrets:$missing"
            exit 1
          fi
          echo "✅ build-and-push secrets OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub (for FC nodes)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker-image
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            XRAY_VERSION=v26.2.6

  deploy-fc:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # 节点列表来自仓库 Variables: FC_NODES,逗号分隔(如 "sg,hk,seoul")
        #   - 未设置 FC_NODES 时 matrix 生成占位 "__none__",由校验步骤显式报错
        #   - 配置入口: GitHub → Settings → Secrets and variables → Actions → Variables → FC_NODES
        #   - 可用节点键: sg,hk,seoul,tokyo,kl,jakarta,bangkok,frankfurt,london,va,sv
        node: ${{ vars.FC_NODES != '' && fromJSON(format('["{0}"]', join(split(vars.FC_NODES, ','), '","'))) || fromJSON('["__none__"]') }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate FC_NODES
        env:
          FC_NODES: ${{ vars.FC_NODES }}
          NODE: ${{ matrix.node }}
        run: |
          if [ -z "${FC_NODES//[[:space:]]/}" ]; then
            echo "❌ FC_NODES 未设置或为空,未指定任何部署节点"
            echo "请配置: GitHub → Settings → Secrets and variables → Actions → Variables → FC_NODES"
            echo "示例: FC_NODES = sg,hk,seoul"
            exit 1
          fi
          case "$NODE" in
            sg|hk|seoul|tokyo|kl|jakarta|bangkok|frankfurt|london|va|sv|hangzhou|shanghai|qingdao|beijing|zhangjiakou|huhehaote|wulanchabu|shenzhen|chengdu) ;;
            *) echo "❌ 未知节点: '$NODE'(FC_NODES 含无效节点键)"; exit 1 ;;
          esac
          echo "✅ 部署节点: $NODE"

      - name: Check required secrets (deploy-fc)
        env:
          ALIBABA_CLOUD_ACCOUNT_ID: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          UUID: ${{ secrets.UUID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          missing=""
          [ -n "$ALIBABA_CLOUD_ACCOUNT_ID" ] || missing="$missing ALIBABA_CLOUD_ACCOUNT_ID"
          [ -n "$ALIBABA_CLOUD_ACCESS_KEY_ID" ] || missing="$missing ALIBABA_CLOUD_ACCESS_KEY_ID"
          [ -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" ] || missing="$missing ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          [ -n "$UUID" ] || missing="$missing UUID"
          [ -n "$DOCKERHUB_USERNAME" ] || missing="$missing DOCKERHUB_USERNAME"
          if [ -n "$missing" ]; then
            echo "❌ Missing secrets:$missing"
            exit 1
          fi
          echo "✅ deploy-fc secrets OK"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s@3.1.10

      - name: Configure Aliyun credentials (access=default)
        env:
          ALIBABA_CLOUD_ACCOUNT_ID: ${{ secrets.ALIBABA_CLOUD_ACCOUNT_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          s config add -a default \
            --AccountID "$ALIBABA_CLOUD_ACCOUNT_ID" \
            --AccessKeyID "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --AccessKeySecret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            -f

      - name: Deploy FC node (${{ matrix.node }})
        env:
          UUID: ${{ secrets.UUID }}
          GRPC_SERVICE_NAME: ${{ secrets.GRPC_SERVICE_NAME || 'ProxyService' }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          cd fc
          s voynix-${{ matrix.node }} deploy -y
