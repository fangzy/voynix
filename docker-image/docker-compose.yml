services:
  voynix-xray:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APK_MIRROR: mirrors.aliyun.com
    ports:
      - "8089:8089"
    environment:
      - UUID=${UUID}
      - GRPC_SERVICE_NAME=${GRPC_SERVICE_NAME:-ProxyService}
      - TRANSPORT=${TRANSPORT:-ws}   # ws(默认,生产) | grpc(回退)
      - WS_PATH=${WS_PATH:-ws}
    restart: unless-stopped
